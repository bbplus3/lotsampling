[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lotsampling"
version = "0.1.0"
description = "Create, evaluate, and visualize zero-acceptance sampling plans."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

authors = [
    { name = "Bonnie Bingham" }
]

keywords = [
    "acceptance sampling",
    "quality control",
    "quality engineering",
    "binomial distribution",
    "hypergeometric distribution",
    "statistical sampling",
    "zero acceptance",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.40",
    "pandas>=2.0",
]

dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/bbplus3/lotsampling"
Repository = "https://github.com/bbplus3/lotsampling"
Issues = "https://github.com/bbplus3/lotsampling/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"